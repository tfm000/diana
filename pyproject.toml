[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diana"
version = "1.0.0"
description = "Text-to-Speech Document Converter"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "streamlit>=1.30.0",
    "PyMuPDF>=1.23.0",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdown>=3.5",
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "piper-tts>=1.0.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version>='3.13'",
    "winrt-Windows.Media.SpeechSynthesis>=3.2.1; sys_platform == 'win32'",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "platformdirs>=4.10.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "claude-agent-sdk>=0.1.59",
    "claude-code-sdk>=0.0.10",
    "google-generativeai>=0.5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30.0", "anthropic>=0.25.0", "claude-agent-sdk>=0.1.59", "claude-code-sdk>=0.0.10", "google-generativeai>=0.5.0"]
news = ["requests>=2.31.0"]
all = ["openai>=1.30.0", "anthropic>=0.25.0", "claude-agent-sdk>=0.1.59", "claude-code-sdk>=0.0.10", "google-generativeai>=0.5.0", "requests>=2.31.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
diana = "run:main"

[tool.setuptools.packages.find]
# Explicit discovery so the data-only package (no .py beyond __init__) is collected.
include = ["diana*"]

[tool.setuptools.package-data]
# Ship the bundled curated Piper manifest (D-02) and the curated preview samples
# (diana/data/samples/*, added in Plan 04). The Phase-6 packager MUST verify these
# land in the PyInstaller bundle (RESEARCH Runtime State Inventory).
diana = ["data/*.json", "data/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["network: hits real network endpoints (HF/GitHub); excluded by default"]
# Exclude the opt-in network smoke from the default run; opt in with `-m network`
# (override the deselect with `-m "network"` which replaces this expression).
addopts = "-m 'not network'"
